plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

description = 'The HouseGraph desktop application.'

javafx {
    version = '21.0.4'
    // javafx.controls arrives transitively from :housegraph-api, but is named here too so this
    // module states its own requirements.
    modules = ['javafx.controls']
}

application {
    // Launcher, not App: a non-Application main class so JavaFX starts cleanly from a plain
    // classpath jar. Do not move main into App.
    mainClass = 'io.github.jaymcole.housegraph.Launcher'
}

dependencies {
    // Brings JavaFX, org.json and slf4j-api transitively (all declared `api` over there). Every
    // integration node category has been extracted into out-of-tree node libraries — see
    // docs/architecture/plugins.md — so this is the only dependency app/ has left.
    implementation project(':housegraph-api')
}
