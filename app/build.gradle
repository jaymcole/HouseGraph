plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.5'
}

description = 'The HouseGraph desktop application.'

javafx {
    version = '21.0.4'
    // javafx.controls arrives transitively from :housegraph-api, but is named here too so this
    // module states its own requirements.
    modules = ['javafx.controls']
}

application {
    // Launcher, not App: a non-Application main class so JavaFX starts cleanly from a plain
    // classpath jar. Do not move main into App.
    mainClass = 'io.github.jaymcole.housegraph.Launcher'
}

dependencies {
    // Brings JavaFX, org.json and slf4j-api transitively (all declared `api` over there). Every
    // integration node category has been extracted into out-of-tree node libraries — see
    // docs/engine/plugin-runtime.md — so this is the only dependency app/ has left.
    implementation project(':housegraph-api')
}

shadowJar {
    // Plain name (no "-all" suffix) so it's easy to find: app/build/libs/app-<version>.jar.
    archiveClassifier = ''
    // housegraph-api ships an SLF4J provider registered via META-INF/services; merge rather
    // than let one copy silently win if another provider ever ends up on the runtime classpath.
    mergeServiceFiles()
    manifest {
        // What `housegraph --version` reports. On a machine running graphs unattended this is the
        // only way to tell which build is actually deployed, so it has to be in the jar itself
        // rather than inferred from a filename someone may have changed.
        attributes 'Implementation-Version': project.version
    }
}
