name: Release

# Pushing a tag builds and tests both modules on Linux, macOS and Windows, then attaches all three
# standalone app jars to a GitHub Release. housegraph-api itself is published separately, by
# JitPack building the same tag (see jitpack.yml) — this workflow doesn't need to do anything for
# that.
# Also accepts workflow_dispatch, with the tag as an input: a workflow's own GITHUB_TOKEN is
# blocked from triggering other workflows' `push: tags` events (GitHub's anti-recursion guard), so
# auto-tag.yml — which pushes tags with that same token — cannot rely on this trigger firing and
# instead dispatches this workflow directly. workflow_dispatch is exempt from that guard.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.8.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # org.openjfx.javafxplugin picks JavaFX's native libraries based on the machine doing
          # the build, so each OS in this matrix bundles its own natives automatically — nothing
          # to configure per leg beyond which runner it runs on. macos-latest is Apple Silicon, so
          # the macOS jar bundles aarch64 natives and won't run natively on an Intel Mac (same
          # caveat documented for local builds in docs/guides/getting-started.md).
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: chmod +x ./gradlew
        shell: bash

      - name: Build and test both modules
        id: build
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # `build` already produces the standalone app jar: the shadow plugin wires `shadowJar`
        # into `assemble`. It lands next to the plain `jar` task's output (app-<version>-thin.jar)
        # without colliding, since app/build.gradle gives the plain jar its own classifier.
        run: |
          set -euo pipefail
          ./gradlew build "-Pversion=${TAG#v}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Give this leg's jar a platform suffix
        shell: bash
        # shadowJar always writes app-<version>.jar regardless of platform; every matrix leg
        # produces one at that same path, so each needs a distinct name before all three land
        # together in the same release.
        run: |
          set -euo pipefail
          mv "app/build/libs/app-${{ steps.build.outputs.version }}.jar" \
             "app/build/libs/app-${{ steps.build.outputs.version }}-${{ matrix.platform }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.platform }}
          path: app/build/libs/app-${{ steps.build.outputs.version }}-${{ matrix.platform }}.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
          merge-multiple: true

      - name: Attach the platform jars to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.jar
          generate_release_notes: true
