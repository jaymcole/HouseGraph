name: Sync shared docs to companion repos

# Mirrors docs/shared/ into housegraph-nodes and housegraph-plugin-template
# on every push to main. See docs/doc-sync.md for the design.

on:
  push:
    branches: [main]
    paths:
      - 'docs/shared/**'

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'jaymcole/HouseGraph'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [housegraph-nodes, housegraph-plugin-template]
    steps:
      - name: Checkout HouseGraph
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout ${{ matrix.target }}
        uses: actions/checkout@v4
        with:
          repository: jaymcole/${{ matrix.target }}
          token: ${{ secrets.DOCS_SYNC_PAT }}
          path: target

      - name: Mirror docs/shared
        run: |
          rm -rf target/docs/shared
          mkdir -p target/docs/shared
          cp -r source/docs/shared/. target/docs/shared/

      - name: Open and auto-merge sync PR
        if: ${{ !cancelled() }}
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_PAT }}
        run: |
          set -euo pipefail

          if git status --porcelain | grep -q .; then
            git config user.name "housegraph-docs-sync[bot]"
            git config user.email "actions@github.com"
            git checkout -B docs-sync
            git add docs/shared
            git commit -m "docs: sync shared documentation from HouseGraph

Source: https://github.com/jaymcole/HouseGraph/commit/${{ github.sha }}"
            git push -f origin docs-sync

            EXISTING_PR=$(gh pr list --repo "jaymcole/${{ matrix.target }}" \
              --head docs-sync --json number --jq '.[0].number')

            if [ -n "$EXISTING_PR" ]; then
              PR_NUMBER="$EXISTING_PR"
            else
              PR_URL=$(gh pr create --repo "jaymcole/${{ matrix.target }}" \
                --base main --head docs-sync \
                --title "docs: sync shared documentation from HouseGraph" \
                --body "Automated sync of \`docs/shared/\` from jaymcole/HouseGraph@${{ github.sha }}.")
              PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            fi

            gh pr merge "$PR_NUMBER" --repo "jaymcole/${{ matrix.target }}" \
              --squash --delete-branch
          else
            echo "No changes to sync for ${{ matrix.target }}."
          fi
