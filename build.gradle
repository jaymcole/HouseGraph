// The root project builds nothing itself; it holds the settings both modules share.
//
// (`subprojects {}` is cross-project configuration, which Gradle intends to replace with
// convention plugins in buildSrc. That's the upgrade path when this grows — two modules
// don't justify a buildSrc yet.)
// JitPack builds a tag and passes it as -Pversion=<tag> (see jitpack.yml), which Gradle sets
// on the root project before this script runs. Honour it when present so the published
// artifact's version always matches the tag it was built from, and fall back to this literal
// for ordinary local builds. Assigning `version` unconditionally below would silently discard
// the tag and publish everything as FALLBACK_VERSION.
def FALLBACK_VERSION = '0.2.0'
def resolvedVersion = rootProject.version.toString() == 'unspecified'
        ? FALLBACK_VERSION
        : rootProject.version.toString()

subprojects {
    apply plugin: 'java'

    group = 'io.github.jaymcole'
    version = resolvedVersion

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    javadoc {
        // Keep the doclint checks that catch real mistakes (broken @link references, bad HTML,
        // syntax), but drop the "missing" group: this codebase documents at the class level and
        // deliberately leaves trivial getters/setters, abstract stubs, and record boilerplate
        // uncommented. Records and key public API still carry @param/@return where it adds value.
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}
